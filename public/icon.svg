<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064B32"/>
      <stop offset="50%" stop-color="#08784F"/>
      <stop offset="100%" stop-color="#09251B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588"/>
      <stop offset="50%" stop-color="#E9B949"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF4D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E9B949" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Islamic 8-Point Star Geometric Border Accent -->
  <g opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="210"/>
    <rect x="106" y="106" width="300" height="300" rx="20" transform="rotate(45 256 256)"/>
    <rect x="106" y="106" width="300" height="300" rx="20"/>
  </g>

  <!-- Islamic Crescent & Star -->
  <g transform="translate(256, 175) scale(0.95)">
    <!-- Crescent -->
    <path d="M 0 -70 A 75 75 0 1 0 52 52 A 62 62 0 1 1 0 -70 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- 8-pointed star in crescent opening -->
    <g transform="translate(36, -20) scale(0.7)">
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="url(#goldGrad)"/>
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="url(#goldGrad)" transform="rotate(45)"/>
    </g>
  </g>

  <!-- Open Noble Quran Book -->
  <g transform="translate(256, 335) scale(0.95)">
    <!-- Book Stand / Rihal -->
    <path d="M -85 75 L 0 20 L 85 75 L 105 55 L 0 -10 L -105 55 Z" fill="#09251B" opacity="0.6"/>
    <path d="M -90 70 L 0 15 L 90 70" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Left Page -->
    <path d="M -8 -45 C -45 -55 -110 -40 -125 -15 C -128 35 -110 50 -8 40 Z" fill="#FFFDF5"/>
    <path d="M -8 -45 C -45 -55 -110 -40 -125 -15 C -128 35 -110 50 -8 40 Z" fill="url(#goldShine)"/>
    <path d="M -8 -45 C -45 -55 -110 -40 -125 -15" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
    <!-- Left page text lines -->
    <line x1="-30" y1="-25" x2="-95" y2="-20" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-25" y1="-5" x2="-100" y2="0" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-30" y1="15" x2="-90" y2="20" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Right Page -->
    <path d="M 8 -45 C 45 -55 110 -40 125 -15 C 128 35 110 50 8 40 Z" fill="#FFFDF5"/>
    <path d="M 8 -45 C 45 -55 110 -40 125 -15 C 128 35 110 50 8 40 Z" fill="url(#goldShine)"/>
    <path d="M 8 -45 C 45 -55 110 -40 125 -15" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
    <!-- Right page text lines -->
    <line x1="30" y1="-25" x2="95" y2="-20" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="25" y1="-5" x2="100" y2="0" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="30" y1="15" x2="90" y2="20" stroke="#064B32" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Book Spine Rib Ribbon -->
    <circle cx="0" cy="-2" r="5" fill="url(#goldGrad)"/>
    <path d="M 0 0 C 5 25 -10 55 -5 70" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
